name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check_skill.py
      - run: python3 -m unittest discover -s dsh-plugin/tests -v
